name: Backend API CI

on:
  push:
    branches: [main, 'claude/**']
    paths: ['backend/**']
  pull_request:
    branches: [main]
    paths: ['backend/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: samplechain
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: samplechain_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://samplechain:testpass@localhost:5432/samplechain_test
        run: psql "$DATABASE_URL" -f src/db/schema.sql

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://samplechain:testpass@localhost:5432/samplechain_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
          NODE_ENV: test
        run: npm test
