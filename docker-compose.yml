version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: samplechain
      POSTGRES_PASSWORD: samplechain_dev
      POSTGRES_DB: samplechain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://samplechain:samplechain_dev@postgres:5432/samplechain
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      PORT: 3000
      NODE_ENV: development
      BASE_RPC_URL: https://sepolia.base.org
      IPFS_GATEWAY_URL: https://gateway.pinata.cloud/ipfs
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
